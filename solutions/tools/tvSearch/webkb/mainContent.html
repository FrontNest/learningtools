<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <title>WwebKb Tartalom</title>
    <style>
        body { font-family: Arial; margin: 0; padding: 2em; background: #fff; }
        h2 { color: #222; margin-top: 2em; }
        p { color: #444; }
        .bookmark { padding: 1em; border-bottom: 1px solid #eee; }
    </style>
</head>
<body>
    <div class="bookmark" id="bookmark1">
        <h2>Első könyvjelző</h2>
        <p>Ez az első minta tartalom, amelyhez a tartalomjegyzékből ugorhatsz.</p>
    </div>
    <div class="bookmark" id="bookmark2">
        <h2>Második könyvjelző</h2>
        <p>Itt a második minta tartalom, szabadon szerkeszthető.</p>
    </div>
    <div class="bookmark" id="bookmark3">
        <h2>Harmadik könyvjelző</h2>
        <p>Ez a harmadik minta tartalom, amelyet a tartalomjegyzékből érhetsz el.</p>
    </div>
</body>
</html>
