<!DOCTYPE html>
<html lang="hu">
<head>
    <!-- A legprimitívebb knowledge base oldalt próbálom létrehozni, amiben nincs olyan dolog, ami a 
     rendszer biztonságát veszélyeztethetné, ezért ez a lehető legalapabb strukturájú, html + internal css 
     flexboxos oldal bookmarkokkal és ósdi iframe megoldásokkal. Munkára jó lesz.
     Nem szép, de csak egy CTRL+F -nél hasznosabbat szeretnék a munkámhoz. 
     Ha bárkinek gondja van vele securty okból (én nem tudom, mi lehet, de bármi megtörténhet), 
     pls szóljon, mielőtt eszkalál! Köszi! Besnyői -->

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="WebKb - Webes tudásbázis, tartalomjegyzékkel és könyvjelzőkkel">
    <meta name="keywords" content="webkb, tudásbázis, bookmark, tartalomjegyzék, webes eszköz">
    <meta name="author" content="BesnyőiG">
    <title>WebKb</title>
    <style>
        body {
            margin: 0;
            font-family: 'Noto Sans', Arial, sans-serif;
            background: #03011f;
        }
        .header {
            width: 100%;
            background: #03011f;
            color: #b6b6b7;            
            padding: clamp(0.2rem, 1vw, 1.5rem) 0;
            text-align: center;
            font-size: clamp(1.5rem, 2.5vw, 2rem);
            font-weight: bold;
            letter-spacing: 2px;
        }
        .container {
            display: flex;
            flex-direction: row;
            height: calc(100vh - clamp(2rem, 3vw, 4rem));
            min-height: 200px;
        }
        .sidebar {
            width: clamp(180px, 25vw, 350px);
            background: #03011f;
            border-right: 1px solid #b6b6b7;
            height: 100%;
            overflow: hidden;
        }
        .main {
            flex: 1;
            background: #b6b6b7;
            height: 100%;
            overflow: hidden;
        }
        iframe {
            border: none;
            width: 100%;
            height: 100%;
            display: block;
        }
        @media (max-width: 900px) {
            .container {
                flex-direction: column;
            }
            .sidebar {
                width: 100%;
                height: clamp(120px, 25vh, 220px);
            }
            .main {
                height: calc(100vh - clamp(8rem, 32vw, 16rem));
            }
        }
    </style>
</head>
<body>
    <div class="header">WebKb</div>
    <div class="container">
        <div class="sidebar">
            <!-- Tartalomjegyzék -->
            <iframe src="toc.html"></iframe>
        </div>
        <div class="main">
            <!-- Main content -->
            <iframe name="mainContent" src="mainContent.html"></iframe>
        </div>
    </div>
</body>
</html>
