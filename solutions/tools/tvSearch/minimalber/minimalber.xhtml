<?xml version="1.0" encoding="utf-8"?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Strict//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-strict.dtd">
<html xmlns="http://www.w3.org/1999/xhtml" lang="hu">
  <head>
    <meta http-equiv="Content-Type" content="application/xhtml+xml; charset=utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Arányos szolgálati idő kalkulátor</title>
    <link rel="stylesheet" type="text/css" href="minimalber.css" />
  </head>
  <body>
    <div id="container">
      <h1>Arányos szolgálati idő kalkulátor</h1>
      <form id="kalkulatorForm" action="#" method="get">
        <fieldset>
          <legend>Bemeneti adatok</legend>
          <div class="input-sor">
            <label for="datumKezdet">Időszak kezdete:
              <input type="date" id="datumKezdet" name="datumKezdet" required="required" />
            </label>
            <label for="datumVeg">Időszak vége:
              <input type="date" id="datumVeg" name="datumVeg" required="required" />
            </label>
          </div>
          <div class="input-sor">
            <label for="kereset">Járulékalapot képező éves kereset (Ft):
              <input type="number" id="kereset" name="kereset" min="0" step="1" required="required" />
            </label>
            <label for="foglForma">Foglalkoztatási forma:
              <select id="foglForma" name="foglForma" required="required">
                <option value="reszmunkaido">Részmunkaidő</option>
                <option value="teljesmunkaido">Teljes munkaidő</option>
                <option value="tobbesjogviszony">Többes jogviszony</option>
              </select>
            </label>
          </div>
          <div class="form-row">
            <!-- Minimálbér select mező eltávolítva, automatikus választás lesz -->
          </div>
          <div class="form-row">
            <label>Szituáció:</label>
            <span class="radio-group-row radio-group">
              <label><input type="radio" id="szit1" name="szituacio" value="1" checked="checked" />1. Csak részmunkaidő</label>
              <label><input type="radio" id="szit2" name="szituacio" value="2" />2. Részmunkaidő + teljes munkaidő</label>
              <label><input type="radio" id="szit3" name="szituacio" value="3" />3. Több részmunkaidő</label>
              <label><input type="radio" id="szit4" name="szituacio" value="4" />4. Teljes munkaidő</label>
            </span>
          </div>
        </fieldset>
        <div class="form-row">
          <button type="submit" id="szamolBtn">Számítás</button>
        </div>
        <div id="munkaviszonyokContainer"></div>
        <div class="form-row">
          <button type="button" id="ujMunkaviszonyBtn">Új munkaviszony hozzáadása</button>
        </div>
        <!-- A JS-ben generált kártyák markupját is módosítani kell, hogy kartya-sor div-et használjon -->
      </form>
      <div id="minimalberInfo">
        <strong>Minimálbér harmincada:</strong> <span id="minimalberHarmincad">-</span> Ft
      </div>
      <div id="eredmenyDoboz" class="eredmeny-doboz" aria-live="polite"></div>
        <div id="eredmenyTablaContainer"></div>
    </div>
    <script type="text/javascript" src="minimalber.js"></script>
  </body>
</html>
