<?xml version="1.0" encoding="utf-8"?>
<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:epub="http://www.idpf.org/2007/ops">
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="author" content="FrontNest Studio" />
    <meta name="description" content="Nyuf jegyzet" />
    <title> Minimálbér </title>
   <link rel="stylesheet" href="minimalber.css" />
  </head>
  <body>


    <div class="container">
      <h2>Minimálbér kalkulátor, arányos szolgálati idő</h2>
      <form id="dateForm">
        <label for="startDate">Kezdő dátum:</label>
        <input type="date" id="startDate" name="startDate" />
        <label for="endDate">Vége dátum:</label>
        <input type="date" id="endDate" name="endDate" />
        <hr />
        <div id="jogviszonyokContainer">
          <h4>Jogviszonyok</h4>
          <div class="jogviszony-row">
            <label>Kezdő dátum:</label>
            <input type="date" name="jogviszonyStart[]" />
            <label>Vége dátum:</label>
            <input type="date" name="jogviszonyEnd[]" />
            <label>Munkaidő:</label>
            <select name="munkaido[]">
              <option value="teljes">Teljes</option>
              <option value="rész">Rész</option>
            </select>
            <label>Jövedelem (Ft):</label>
            <input type="number" name="jovedelem[]" min="0" />
            <label>Szünetelés/járulékköteles napok:</label>
            <input type="number" name="szunetNap[]" min="0" value="0" />
          </div>
        </div>
        <button type="button" id="addJogviszonyBtn">+ Jogviszony hozzáadása</button>
        <button type="submit">Számolás</button>
      </form>
      <div id="resultTableContainer">
        <!-- Eredmény táblázat ide kerül -->
      </div>
    </div>
    <script src="minimalber.js"></script>
  </body>
</html>
